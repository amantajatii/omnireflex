[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Uniswap v4 relies on transient storage (EIP-1153).
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
lasna = "https://lasna-rpc.rnk.dev/"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
