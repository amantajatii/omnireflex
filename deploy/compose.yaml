# OmniReflex on the shared VPS. The existing Caddy (koelakan project) terminates TLS
# and reaches these containers over its network; no host ports are published.
name: reflex

services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 512m
    networks:
      edge:
        aliases: [reflex-frontend]
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  indexer:
    build: ./indexer
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=160
    mem_limit: 192m
    volumes:
      - indexer-data:/data
      - ./indexer/records:/app/records:ro
    networks:
      edge:
        aliases: [reflex-indexer]
    logging: *logging

  # Keeps the demo pools tracking real ETH/USD. Its key lives outside the synced
  # directory (~/.omnireflex/pricebot.env) so rsync --delete never touches it.
  pricebot:
    build: ./pricebot
    restart: unless-stopped
    env_file:
      - path: ../.omnireflex/pricebot.env
        required: false
    environment:
      NODE_OPTIONS: --max-old-space-size=96
    mem_limit: 128m
    volumes:
      - ./pricebot/records:/app/records:ro
    networks:
      edge:
        aliases: [reflex-pricebot]
    logging: *logging

volumes:
  indexer-data:

networks:
  edge:
    name: koelakan_default
    external: true
